<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>💜 İyi ki varsın hayatım 💜</title>

<style>
/* 🔧 RENKLERİ BURADAN DEĞİŞTİREBİLİRSİN */
:root{
  --mor1:#2b0a3d;
  --mor2:#5b1894;
  --mor3:#b56bff;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}

body{
  background:linear-gradient(135deg,var(--mor1),var(--mor2));
  color:white;
  overflow-x:hidden;
}

/* 🔐 ŞİFRE EKRANI */
#lock{
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#1c0629,#3b0f5f);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.lock-box{
  background:rgba(0,0,0,0.5);
  padding:30px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 0 25px rgba(181,107,255,0.6);
}

.lock-box input{
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:10px;
  width:220px;
}

.lock-box button{
  margin-top:15px;
  padding:10px 25px;
  border:none;
  border-radius:15px;
  background:var(--mor3);
  font-weight:bold;
  cursor:pointer;
}

/* 🎄 YILBAŞI IŞIKLARI */
.lights{
  display:flex;
  justify-content:center;
  gap:14px;
  padding:15px;
}

.light{
  width:14px;
  height:14px;
  border-radius:50%;
  animation:blink 2s infinite;
}
.light:nth-child(odd){animation-delay:1s;}

@keyframes blink{
  0%,100%{opacity:0.4}
  50%{opacity:1}
}

/* ❄️ HAFİF KAR (DİKKAT DAĞITMAZ) */
.snow span{
  position:fixed;
  top:-10px;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0.2;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(110vh);}
}

/* 💜 BAŞLIK */
header{
  text-align:center;
  padding:25px;
}
header h1{
  color:var(--mor3);
  font-size:2.5em;
}

/* ❤️ MINECRAFT KALPLER */
.hearts{
  display:flex;
  justify-content:center;
  margin:25px 0;
}
.hearts img{
  width:38px;
  margin:0 5px;
  cursor:pointer;
  image-rendering:pixelated;
}

/* 💬 KALP MESAJI */
#loveText{
  text-align:center;
  margin-top:15px;
  font-size:1.4em;
  color:#ffd6ff;
  min-height:40px;
  transition:0.4s;
}

/* 📦 BÖLÜM */
.section{
  background:rgba(0,0,0,0.35);
  margin:25px auto;
  padding:25px;
  max-width:900px;
  border-radius:20px;
}

/* 📷 GALERİ */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}
.gallery img{
  width:100%;
  border-radius:15px;
}
</style>
</head>

<body>

<!-- 🔐 ŞİFRE -->
<div id="lock">
  <div class="lock-box">
    <h2>💜 Sadece Sana Özel 💜</h2>
    <input type="password" id="pass" placeholder="Şifre">
    <br>
    <button onclick="unlock()">Giriş</button>
    <p id="error"></p>
  </div>
</div>

<!-- 🎄 IŞIKLAR -->
<div class="lights">
  <div class="light" style="background:red"></div>
  <div class="light" style="background:yellow"></div>
  <div class="light" style="background:lime"></div>
  <div class="light" style="background:cyan"></div>
  <div class="light" style="background:magenta"></div>
</div>

<header>
  <h1>💜 İyi ki biz aşkım 💜</h1>
</header>

<!-- ❤️ KALPLER -->
<div class="hearts">
  <img src="https://i.imgur.com/YQZ6K8H.png" onclick="showLove()">
  <img src="https://i.imgur.com/YQZ6K8H.png" onclick="showLove()">
  <img src="https://i.imgur.com/YQZ6K8H.png" onclick="showLove()">
  <img src="https://i.imgur.com/YQZ6K8H.png" onclick="showLove()">
  <img src="https://i.imgur.com/YQZ6K8H.png" onclick="showLove()">
</div>

<div id="loveText"></div>

<div class="section">
  <h2>📷 Anılarımız</h2>
  <div class="gallery">
    <!-- 🔧 FOTOĞRAF DOSYA ADLARINI BURAYA YAZ -->
    <img src="DEB372E5-5122-4FF9-8EBA-A7401B18C028.jpg">
    <img src="IMG_8491.jpg">
    <img src="IMG_9392.jpg">
  </div>
</div>

</body>
</html>
